<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performance Requests Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --dark:#435A60; --dark-2:#33454a; --gold:#C89831; --gold-light:#F3E9D2;
    --bg:#F6F4EF; --card:#FFFFFF; --line:#E4E0D6; --text:#232823; --muted:#756F62;
    --green:#2E7D53; --red:#B03A2E;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Tajawal',sans-serif; background:var(--bg); color:var(--text); }
  .wrap{ max-width:840px; margin:0 auto; padding:30px 22px 70px; }

  .brand{ display:flex; align-items:center; justify-content:center; margin-bottom:22px; }
  .brand-logo{ height:64px; width:auto; }
  .brand-org{ font-size:13px; color:var(--muted); }
  .brand-title{ font-size:24px; font-weight:900; color:var(--dark); margin-top:6px; direction:ltr; }
  .footer-link{ text-align:center; margin-top:34px; font-size:12px; color:var(--muted); }
  .footer-link a{ color:var(--muted); text-decoration:underline; cursor:pointer; }

  .tabs{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:26px; }
  .tab{
    background:var(--gold-light); border:2px solid transparent; border-radius:12px;
    padding:18px 10px; text-align:center; cursor:pointer; transition:.15s; user-select:none;
  }
  .tab:hover{ transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,.08); }
  .tab.active{ background:var(--dark); border-color:var(--gold); }
  .tab .label{ font-size:14.5px; font-weight:700; color:var(--dark); }
  .tab.active .label{ color:#fff; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:18px; overflow:hidden; }
  .section-head{ background:var(--dark); color:#fff; font-weight:700; font-size:14px; padding:11px 18px; display:flex; justify-content:space-between; align-items:center; }
  .status-chip{ font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; }
  .status-chip.pending{ background:#fbf1de; color:#C9962C; }
  .status-chip.approved{ background:#e7f3ec; color:var(--green); }
  .status-chip.rejected{ background:#f7e6e3; color:var(--red); }

  .fields{ padding:6px 18px 14px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:12px 0; border-bottom:1px solid var(--line); }
  .field-row:last-child{ border-bottom:none; }
  .field-row.full{ grid-template-columns:1fr; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:13px; font-weight:700; color:var(--dark); }
  input[type=text], input[type=date], select, textarea{
    font-family:'Tajawal',sans-serif; border:1.5px solid var(--line); border-radius:8px; padding:9px 11px;
    font-size:13.5px; background:#fff; color:var(--text); width:100%;
  }
  textarea{ resize:vertical; min-height:100px; }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(200,152,49,.15); }
  select{ cursor:pointer; }
  input[readonly], textarea[readonly], .readonly-val{
    background:#F7F6F2; border-style:dashed; color:var(--text); font-weight:500;
  }
  .readonly-val{ border:1.5px dashed var(--line); border-radius:8px; padding:9px 11px; font-size:13.5px; min-height:20px; }

  .desc-line{ background:var(--gold-light); border-right:4px solid var(--gold); padding:10px 14px; border-radius:6px; font-size:13.5px; color:#5c4c22; margin-bottom:18px; }
  .form-title{ font-size:21px; font-weight:900; color:var(--dark); margin:0 0 4px; }
  .code-pill{ display:inline-block; background:var(--gold-light); color:var(--dark); font-weight:700; font-size:12px; padding:5px 12px; border-radius:20px; margin-bottom:12px; }

  .approval-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; gap:8px; }
  .approval-row:last-child{ border-bottom:none; }
  .approval-label{ font-size:14px; font-weight:700; color:var(--dark); }
  .approval-label .date{ font-size:11px; font-weight:400; color:var(--muted); display:block; margin-top:2px; }
  .toggle-group{ display:flex; gap:8px; }
  .toggle-btn{
    padding:8px 18px; border-radius:20px; border:1.5px solid var(--line); background:#fff;
    font-family:'Tajawal',sans-serif; font-size:13px; font-weight:700; cursor:pointer; color:var(--muted);
  }
  .toggle-btn:disabled{ cursor:default; opacity:.55; }
  .toggle-btn.accept.selected{ background:#e7f3ec; border-color:var(--green); color:var(--green); }
  .toggle-btn.reject.selected{ background:#f7e6e3; border-color:var(--red); color:var(--red); }
  .waiting-note{ font-size:12.5px; color:var(--muted); }
  .signature-row{ display:flex; align-items:center; gap:10px; padding-bottom:14px; border-bottom:1px solid var(--line); }
  .approval-row + .signature-row{ margin-top:-6px; }
  .signature-attach-btn{
    display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:var(--dark);
    background:#fff; border:1.5px dashed var(--line); border-radius:20px; padding:7px 14px; cursor:pointer;
  }
  .signature-attach-btn.attached{ border-style:solid; border-color:var(--green); color:var(--green); background:#e7f3ec; }
  .signature-thumb{ height:34px; max-width:110px; object-fit:contain; border:1px solid var(--line); border-radius:6px; background:#fff; padding:2px; }
  .signature-caption{ font-size:12px; color:var(--muted); }
  .signature-remove{ background:none; border:none; color:var(--red); font-size:13px; cursor:pointer; padding:2px 6px; }

  .actions{ margin:10px 0 24px; display:flex; gap:10px; }
  button{ font-family:'Tajawal',sans-serif; cursor:pointer; border:none; border-radius:9px; font-size:14.5px; font-weight:700; padding:13px 26px; }
  .btn-submit{ background:var(--dark); color:#fff; flex:1; }
  .btn-submit:hover{ background:var(--dark-2); }
  .btn-submit:disabled{ opacity:.6; cursor:not-allowed; }
  .btn-ghost{ background:#fff; color:var(--dark); border:1.5px solid var(--line); }
  .btn-ghost:hover{ border-color:var(--gold); }

  .success-card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:36px 24px; text-align:center; }
  .success-icon{ font-size:44px; margin-bottom:14px; }
  .success-title{ font-size:18px; font-weight:900; color:var(--dark); margin-bottom:6px; }
  .success-sub{ font-size:13.5px; color:var(--muted); margin-bottom:20px; }
  .link-box{ display:flex; gap:8px; margin:16px 0; }
  .link-box input{ flex:1; text-align:left; direction:ltr; font-size:12px; }

  .inbox-row{ display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-top:1px solid var(--line); cursor:pointer; }
  .inbox-row:hover{ background:#FAF9F5; }
  .inbox-title{ font-size:13.5px; font-weight:700; color:var(--dark); }
  .inbox-sub{ font-size:11.5px; color:var(--muted); }
  .empty-state{ padding:24px 18px; text-align:center; color:var(--muted); font-size:13px; }

  @media print{
    .tabs, .actions, .link-box, .brand-link{ display:none !important; }
    body{ background:#fff; }
  }
</style>
</head>

<script>
/* ================= Config ================= */

const CLASS_OPTIONS = ["استراتيجي", "تشغيلي"];
const EDIT_TYPE_OPTIONS = ["المستهدف", "طريقة الاحتساب", "الدورية"];
const EDIT_NATURE_OPTIONS = ["استبدال", "زيادة", "نقص"];

// Optional: once you have an email-automation webhook (Power Automate / Zapier / Make),
// put its URL here so every submission/approval step also POSTs a copy for a real email ping.
const WEBHOOK_URL = "https://eor7eyxx4l7mz8l.m.pipedream.net";

const TYPES = [
  { id:"EDIT", label:"طلب تعديل مؤشر", title:"طلب تعديل مؤشر",
    section2Head:"ثانياً: تفاصيل طلب التعديل",
    section2Fields:[
      { key:"editType", label:"نوع التعديل", type:"select", options:EDIT_TYPE_OPTIONS },
      { key:"editNature", label:"طبيعة التعديل", type:"select", options:EDIT_NATURE_OPTIONS },
      { key:"requester", label:"مقدم الطلب", type:"text" },
      { key:"requestDate", label:"تاريخ الطلب", type:"date" },
    ],
    justifyLabel:"مبررات الطلب" },
  { id:"CANCEL", label:"طلب إلغاء مؤشر", title:"طلب إلغاء مؤشر",
    section2Head:"ثانياً: تفاصيل طلب الإلغاء",
    section2Fields:[
      { key:"requester", label:"مقدم الطلب", type:"text" },
      { key:"requestDate", label:"تاريخ الطلب", type:"date" },
    ],
    justifyLabel:"سبب الإلغاء ومبرراته" },
  { id:"ADD", label:"طلب إضافة مؤشر", title:"طلب إضافة مؤشر",
    section2Head:"ثانياً: تفاصيل طلب الإضافة",
    section2Fields:[
      { key:"requester", label:"مقدم الطلب", type:"text" },
      { key:"requestDate", label:"تاريخ الطلب", type:"date" },
    ],
    justifyLabel:"مبررات إضافة المؤشر (الفجوة التي يغطيها)" },
];

function typeOf(id){ return TYPES.find(t=>t.id===id); }

let currentType = "EDIT";
let currentValues = {};
let currentJustify = "";
let approvals = { strategy:null, strategyDate:null, ceo:null, ceoDate:null };
let submitted = false;
let mode = "new"; // 'new' | 'review' | 'inbox'
let activeRequestId = null;
let activeRequest = null;

/* ================= URL / routing ================= */

function getParam(name){
  const p = new URLSearchParams(window.location.search);
  return p.get(name);
}
function buildLink(id){
  return window.location.origin + window.location.pathname + "?id=" + id;
}
function goInbox(){
  const url = new URL(window.location.href);
  url.searchParams.set("admin", "1");
  url.searchParams.delete("id");
  window.location.href = url.toString();
}

/* ================= Storage ================= */

function uid(){ return Math.random().toString(36).slice(2,9); }

async function saveRequest(id, data){
  try{ await window.storage.set('request:'+id, JSON.stringify(data), true); }catch(e){}
}
async function loadRequest(id){
  try{
    const r = await window.storage.get('request:'+id, true);
    return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function listRequests(){
  try{
    const l = await window.storage.list('request:', true);
    if(!l || !l.keys) return [];
    const out = [];
    for(const k of l.keys){
      try{
        const r = await window.storage.get(k, true);
        if(r) out.push(JSON.parse(r.value));
      }catch(e){}
    }
    out.sort((a,b)=> new Date(b.submittedAt) - new Date(a.submittedAt));
    return out;
  }catch(e){ return []; }
}
async function notifyWebhook(payload){
  if(!WEBHOOK_URL) return { ok:false, error:'لا يوجد رابط ويبهوك مُعرَّف' };
  try{
    const res = await fetch(WEBHOOK_URL, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload) });
    return { ok:true, status: res.status };
  }catch(e){
    return { ok:false, error: (e && e.message) ? e.message : String(e) };
  }
}

/* ================= Tabs (only in "new" mode) ================= */

function renderTabs(){
  const el = document.getElementById('tabs');
  el.innerHTML = "";
  if(mode !== "new"){ el.style.display = "none"; return; }
  el.style.display = "grid";
  TYPES.forEach(t=>{
    const div = document.createElement('div');
    div.className = 'tab' + (currentType === t.id ? ' active' : '');
    div.innerHTML = `<span class="label">${t.label}</span>`;
    div.onclick = ()=>{
      currentType = t.id; currentValues = {}; currentJustify = "";
      approvals = { strategy:null, strategyDate:null, ceo:null, ceoDate:null };
      submitted = false;
      render();
    };
    el.appendChild(div);
  });
}

/* ================= Field helpers ================= */

function renderField(field, readonly){
  const wrap = document.createElement('div');
  wrap.className = 'field';
  const lbl = document.createElement('label');
  lbl.textContent = field.label;
  wrap.appendChild(lbl);

  if(readonly){
    const val = document.createElement('div');
    val.className = 'readonly-val';
    val.textContent = currentValues[field.key] || '—';
    wrap.appendChild(val);
    return wrap;
  }

  if(field.type === "select"){
    const sel = document.createElement('select');
    const empty = document.createElement('option');
    empty.value = ""; empty.textContent = "— اختر —";
    sel.appendChild(empty);
    field.options.forEach(o=>{
      const op = document.createElement('option');
      op.value = o; op.textContent = o;
      if(currentValues[field.key] === o) op.selected = true;
      sel.appendChild(op);
    });
    sel.onchange = (e)=>{ currentValues[field.key] = e.target.value; };
    wrap.appendChild(sel);
    return wrap;
  }

  const input = document.createElement('input');
  input.type = field.type === "date" ? "date" : "text";
  input.value = currentValues[field.key] || "";
  input.oninput = (e)=>{ currentValues[field.key] = e.target.value; };
  wrap.appendChild(input);
  return wrap;
}

function fieldRowsPairs(fields, readonly){
  const rows = [];
  for(let i=0;i<fields.length;i+=2){
    const row = document.createElement('div');
    row.className = 'field-row' + (fields.length - i === 1 ? ' full' : '');
    row.appendChild(renderField(fields[i], readonly));
    if(fields[i+1]) row.appendChild(renderField(fields[i+1], readonly));
    rows.push(row);
  }
  return rows;
}

/* ================= Approval rows ================= */

function approvalRow(label, key){
  const wrap = document.createElement('div');

  const row = document.createElement('div');
  row.className = 'approval-row';
  const l = document.createElement('div');
  l.className = 'approval-label';
  const dateStr = approvals[key+'Date'] ? new Date(approvals[key+'Date']).toLocaleString('ar-SA') : null;
  l.innerHTML = label + (dateStr ? `<span class="date">${dateStr}</span>` : '');
  row.appendChild(l);

  const grp = document.createElement('div');
  grp.className = 'toggle-group';
  const acceptBtn = document.createElement('button');
  acceptBtn.type = 'button';
  acceptBtn.className = 'toggle-btn accept' + (approvals[key]==='accept' ? ' selected' : '');
  acceptBtn.textContent = 'مقبول';
  acceptBtn.onclick = ()=>{ approvals[key] = approvals[key]==='accept' ? null : 'accept'; renderMain(); };
  const rejectBtn = document.createElement('button');
  rejectBtn.type = 'button';
  rejectBtn.className = 'toggle-btn reject' + (approvals[key]==='reject' ? ' selected' : '');
  rejectBtn.textContent = 'مرفوض';
  rejectBtn.onclick = ()=>{ approvals[key] = approvals[key]==='reject' ? null : 'reject'; renderMain(); };
  grp.appendChild(acceptBtn);
  grp.appendChild(rejectBtn);
  row.appendChild(grp);
  wrap.appendChild(row);

  // Signature attach
  const sigKey = key + 'Signature';
  const sigRow = document.createElement('div');
  sigRow.className = 'signature-row';

  const fileLabel = document.createElement('label');
  fileLabel.className = 'signature-attach-btn';
  fileLabel.textContent = approvals[sigKey] ? '✓ تم إرفاق التوقيع' : '📎 إرفاق التوقيع';
  if(approvals[sigKey]) fileLabel.classList.add('attached');
  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = 'image/*';
  fileInput.style.display = 'none';
  fileInput.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ approvals[sigKey] = reader.result; renderMain(); };
    reader.readAsDataURL(file);
  };
  fileLabel.appendChild(fileInput);
  sigRow.appendChild(fileLabel);

  if(approvals[sigKey]){
    const img = document.createElement('img');
    img.src = approvals[sigKey];
    img.className = 'signature-thumb';
    sigRow.appendChild(img);
    const rm = document.createElement('button');
    rm.type = 'button';
    rm.className = 'signature-remove';
    rm.textContent = '✕';
    rm.onclick = ()=>{ approvals[sigKey] = null; renderMain(); };
    sigRow.appendChild(rm);
  }
  wrap.appendChild(sigRow);

  return wrap;
}

/* ================= Shared link box ================= */

function linkBox(container, id, note){
  const p = document.createElement('div');
  p.style.fontSize = "12.5px"; p.style.color = "var(--muted)"; p.style.marginBottom = "6px";
  p.textContent = note;
  container.appendChild(p);
  const box = document.createElement('div');
  box.className = 'link-box';
  const input = document.createElement('input');
  input.type = 'text'; input.readOnly = true; input.value = buildLink(id);
  const copyBtn = document.createElement('button');
  copyBtn.className = 'btn-ghost';
  copyBtn.textContent = 'نسخ';
  copyBtn.onclick = ()=>{
    input.select();
    try{ navigator.clipboard.writeText(input.value); copyBtn.textContent = 'تم النسخ ✓'; }
    catch(e){ document.execCommand && document.execCommand('copy'); }
    setTimeout(()=>copyBtn.textContent='نسخ', 1500);
  };
  box.appendChild(input);
  box.appendChild(copyBtn);
  container.appendChild(box);
}

/* ================= Single-page submission (KPI + details + justification + approval) ================= */

function renderNewForm(type){
  const main = document.getElementById('main');
  main.innerHTML = "";

  if(submitted){
    const s = document.createElement('div');
    s.className = 'success-card';
    const whResult = lastWebhookResult;
    let whLine;
    if(!whResult){
      whLine = 'لم تتم محاولة الإرسال للويبهوك.';
    } else if(whResult.ok){
      whLine = `✓ وصل الإشعار للويبهوك بنجاح (HTTP ${whResult.status})`;
    } else {
      whLine = `✗ فشل إرسال الإشعار — السبب: ${whResult.error}`;
    }
    s.innerHTML = `
      <div class="success-icon">✅</div>
      <div class="success-title">تم إرسال الطلب بنجاح</div>
      <div class="success-sub">وصلت نسخة من الطلب تلقائياً للجهة المختصة.</div>
      <div style="font-size:11.5px; color:var(--muted); direction:ltr; unicode-bidi:plaintext; margin-bottom:14px;">${whLine}</div>
    `;
    const newBtn = document.createElement('button');
    newBtn.className = 'btn-ghost';
    newBtn.style.marginTop = '14px';
    newBtn.textContent = 'تقديم طلب جديد';
    newBtn.onclick = ()=>{
      currentValues={}; currentJustify=""; approvals={strategy:null,strategyDate:null,ceo:null,ceoDate:null};
      submitted=false; render();
    };
    s.appendChild(newBtn);
    main.appendChild(s);
    return;
  }

  const h = document.createElement('div');
  h.className = 'form-title';
  h.textContent = type.title;
  main.appendChild(h);

  const card1 = document.createElement('div');
  card1.className = 'card';
  card1.innerHTML = `<div class="section-head">أولاً: بيانات المؤشر</div>`;
  const fw1 = document.createElement('div'); fw1.className = 'fields';
  const kpiFields = [
    { key:"kpiName", label:"اسم المؤشر", type:"text" },
    { key:"kpiOwner", label:"مالك المؤشر", type:"text" },
    { key:"department", label:"الإدارة / القسم", type:"text" },
    { key:"classification", label:"تصنيف المؤشر", type:"select", options:CLASS_OPTIONS },
  ];
  fieldRowsPairs(kpiFields, false).forEach(r=>fw1.appendChild(r));
  card1.appendChild(fw1);
  main.appendChild(card1);

  const card2 = document.createElement('div');
  card2.className = 'card';
  card2.innerHTML = `<div class="section-head">${type.section2Head}</div>`;
  const fw2 = document.createElement('div'); fw2.className = 'fields';
  fieldRowsPairs(type.section2Fields, false).forEach(r=>fw2.appendChild(r));
  card2.appendChild(fw2);
  main.appendChild(card2);

  const justCard = document.createElement('div');
  justCard.className = 'card';
  justCard.innerHTML = `<div class="section-head">${type.justifyLabel}</div>`;
  const jBody = document.createElement('div'); jBody.style.padding = "14px 18px";
  const ta = document.createElement('textarea');
  ta.value = currentJustify;
  ta.oninput = (e)=>{ currentJustify = e.target.value; };
  jBody.appendChild(ta);
  justCard.appendChild(jBody);
  main.appendChild(justCard);

  const card3 = document.createElement('div');
  card3.className = 'card';
  card3.innerHTML = `<div class="section-head">ثالثاً: الاعتماد</div>`;
  const fw3 = document.createElement('div'); fw3.className = 'fields';
  fw3.appendChild(approvalRow("اعتماد الإدارة الاستراتيجية", "strategy"));
  fw3.appendChild(approvalRow("اعتماد الرئيس التنفيذي", "ceo"));
  card3.appendChild(fw3);
  main.appendChild(card3);

  const actions = document.createElement('div');
  actions.className = 'actions';
  const submitBtn = document.createElement('button');
  submitBtn.className = 'btn-submit';
  submitBtn.textContent = 'Submit';
  submitBtn.onclick = ()=>doSubmitNew(type);
  actions.appendChild(submitBtn);
  main.appendChild(actions);
}

let lastWebhookResult = null;

async function doSubmitNew(type){
  const id = Date.now().toString(36) + '-' + uid();
  const data = {
    id, type: type.id, typeLabel: type.title,
    kpi: {...currentValues}, justification: currentJustify,
    approvals: {...approvals},
    submittedAt: new Date().toISOString(),
  };
  // best-effort local record; core flow does not depend on this working
  saveRequest(id, data);
  lastWebhookResult = await notifyWebhook({ event:'submitted', ...data });
  submitted = true;
  renderMain();
}

/* ================= Boot ================= */

function renderMain(){
  renderNewForm(typeOf(currentType));
}

function render(){
  renderTabs();
  renderMain();
}

(function init(){
  mode = 'new';
  render();
})();
</script>
